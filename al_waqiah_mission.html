<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Waqiah 30 Days Journey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                        'bounce-slight': 'bounceSlight 2s infinite',
                    },
                    keyframes: {
                        bounceSlight: {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Animated Gradient Background */
        body {
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Particles / Bubbles */
        .bg-bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .bg-bubbles li {
            position: absolute;
            list-style: none;
            display: block;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.4);
            bottom: -160px;
            animation: square 25s infinite;
            transition-timing-function: linear;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        .bg-bubbles li:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-delay: 0s; animation-duration: 15s; }
        .bg-bubbles li:nth-child(2) { left: 20%; width: 30px; height: 30px; animation-delay: 2s; animation-duration: 17s; }
        .bg-bubbles li:nth-child(3) { left: 25%; width: 50px; height: 50px; animation-delay: 4s; }
        .bg-bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 22s; }
        .bg-bubbles li:nth-child(5) { left: 70%; width: 20px; height: 20px; animation-delay: 0s; }
        .bg-bubbles li:nth-child(6) { left: 80%; width: 120px; height: 120px; animation-delay: 3s; background-color: rgba(255, 255, 255, 0.2); }
        .bg-bubbles li:nth-child(7) { left: 32%; width: 160px; height: 160px; animation-delay: 7s; }
        .bg-bubbles li:nth-child(8) { left: 55%; width: 20px; height: 20px; animation-delay: 15s; animation-duration: 40s; }
        .bg-bubbles li:nth-child(9) { left: 25%; width: 10px; height: 10px; animation-delay: 2s; animation-duration: 40s; background-color: rgba(255, 255, 255, 0.3); }
        .bg-bubbles li:nth-child(10) { left: 90%; width: 160px; height: 160px; animation-delay: 11s; }

        @keyframes square {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 20%; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        /* Card Interactions */
        .day-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .day-card:hover:not(.disabled) {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }
        .day-card:active:not(.disabled) {
            transform: translateY(0) scale(0.95);
        }

        .star-beat {
            animation: starbeat 1.5s infinite;
        }
        @keyframes starbeat {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(250, 204, 21, 0.5)); }
            50% { transform: scale(1.2); filter: drop-shadow(0 0 15px rgba(250, 204, 21, 1)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(250, 204, 21, 0.5)); }
        }

        .progress-avatar {
            transition: left 1.5s cubic-bezier(0.34, 1.56, 0.64, 1), right 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .notes-container::-webkit-scrollbar { width: 8px; }
        .notes-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.3); border-radius: 10px; }
        .notes-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.8); border-radius: 10px; }

        /* Glowing Star effect for completed days */
        .glowing-star {
            color: #fbbf24; /* Amber-400 */
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.8));
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 font-sans pb-12 relative">

    <!-- Floating Background Particles -->
    <ul class="bg-bubbles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- Header -->
    <header class="pt-12 pb-8 text-center px-4 relative z-10">
        <h1 class="text-4xl md:text-5xl font-display font-extrabold text-white drop-shadow-lg mb-2 tracking-tight">
            Al-Waqiah 30 Days Mission
        </h1>
    </header>

    <main class="max-w-6xl mx-auto px-4 space-y-8 relative z-10">
        
        <!-- Couple Progress Bar -->
        <section class="glass-panel rounded-3xl p-6 relative overflow-hidden">
            <div class="relative w-full h-16 flex items-center mt-2 px-8 md:px-16">
                <!-- Track -->
                <div class="absolute left-8 right-8 md:left-16 md:right-16 h-3 bg-white/50 backdrop-blur-md rounded-full overflow-hidden shadow-inner z-0 border border-white/60">
                    <div class="absolute inset-0 bg-gradient-to-r from-fuchsia-400 via-yellow-200 to-cyan-400 opacity-60"></div>
                </div>
                
                <!-- Center Star -->
                <div class="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10 bg-white p-3 rounded-full shadow-[0_0_15px_rgba(255,255,255,0.8)] text-yellow-400 star-beat">
                    <i class="fa-solid fa-star text-2xl"></i>
                </div>

                <!-- Lena's Avatar -->
                <div id="progress-lena" class="progress-avatar absolute top-1/2 transform -translate-y-1/2 -translate-x-1/2 z-20 flex flex-col items-center" style="left: 0%;">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-pink-400 to-fuchsia-500 border-4 border-white shadow-xl flex items-center justify-center text-white font-black text-lg animate-bounce-slight">L</div>
                    <span class="text-sm font-bold mt-1 text-fuchsia-700 bg-white/70 px-2 py-0.5 rounded-full shadow-sm" id="percent-lena">0%</span>
                </div>

                <!-- Raihan's Avatar -->
                <div id="progress-raihan" class="progress-avatar absolute top-1/2 transform -translate-y-1/2 translate-x-1/2 z-20 flex flex-col items-center" style="right: 0%;">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-cyan-400 to-blue-500 border-4 border-white shadow-xl flex items-center justify-center text-white font-black text-lg animate-bounce-slight" style="animation-delay: 0.5s">R</div>
                    <span class="text-sm font-bold mt-1 text-cyan-700 bg-white/70 px-2 py-0.5 rounded-full shadow-sm" id="percent-raihan">0%</span>
                </div>
            </div>
        </section>

        <!-- Journey Boards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Lena's Board -->
            <section class="glass-panel rounded-3xl p-5 md:p-8 flex flex-col border-t-4 border-t-fuchsia-400">
                <div class="flex justify-between items-end mb-6 border-b-2 border-white/50 pb-4">
                    <div>
                        <h2 class="text-3xl font-display font-extrabold text-fuchsia-700 drop-shadow-sm">Lena</h2>
                        <div class="flex items-center gap-2 mt-1">
                            <div class="bg-fuchsia-100 text-fuchsia-700 text-xs px-2 py-1 rounded-full font-bold">Progress</div>
                        </div>
                    </div>
                    <div class="text-right bg-white/60 p-3 rounded-2xl shadow-sm">
                        <div class="text-sm font-bold text-gray-700">Completed: <span id="stat-comp-lena" class="text-fuchsia-600 text-xl ml-1">0</span></div>
                        <div class="text-xs text-gray-500 font-semibold mt-1">Missed: <span id="stat-miss-lena" class="text-red-500">0</span> | Rem: <span id="stat-rem-lena">30</span></div>
                    </div>
                </div>
                
                <div id="grid-lena" class="grid grid-cols-5 gap-2 md:gap-3 flex-grow">
                    <!-- Cards injected by JS -->
                </div>
            </section>

            <!-- Raihan's Board -->
            <section class="glass-panel rounded-3xl p-5 md:p-8 flex flex-col border-t-4 border-t-cyan-400">
                <div class="flex justify-between items-end mb-6 border-b-2 border-white/50 pb-4">
                    <div>
                        <h2 class="text-3xl font-display font-extrabold text-cyan-700 drop-shadow-sm">Raihan</h2>
                        <div class="flex items-center gap-2 mt-1">
                            <div class="bg-cyan-100 text-cyan-700 text-xs px-2 py-1 rounded-full font-bold">Progress</div>
                        </div>
                    </div>
                    <div class="text-right bg-white/60 p-3 rounded-2xl shadow-sm">
                        <div class="text-sm font-bold text-gray-700">Completed: <span id="stat-comp-raihan" class="text-cyan-600 text-xl ml-1">0</span></div>
                        <div class="text-xs text-gray-500 font-semibold mt-1">Missed: <span id="stat-miss-raihan" class="text-red-500">0</span> | Rem: <span id="stat-rem-raihan">30</span></div>
                    </div>
                </div>
                
                <div id="grid-raihan" class="grid grid-cols-5 gap-2 md:gap-3 flex-grow">
                    <!-- Cards injected by JS -->
                </div>
            </section>

        </div>

        <!-- Notes Section -->
        <section class="glass-panel rounded-3xl p-6 md:p-8 border-t-4 border-t-yellow-300">
            <div class="flex flex-col md:flex-row gap-6">
                <!-- Form -->
                <div class="md:w-1/3 bg-white/60 p-5 rounded-2xl shadow-sm">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center"><i class="fa-solid fa-pen-nib text-yellow-500 mr-2"></i> Tinggalkan Pesan</h3>
                    <select id="note-sender" class="w-full mb-4 p-3 rounded-xl border-none bg-white shadow-inner focus:outline-none focus:ring-4 focus:ring-yellow-300/50 font-semibold text-gray-700">
                        <option value="Lena">Dari: Lena</option>
                        <option value="Raihan">Dari: Raihan</option>
                    </select>
                    <textarea id="note-text" rows="3" placeholder="Tulis semangat atau pesan hari ini..." class="w-full mb-4 p-4 rounded-xl border-none bg-white shadow-inner focus:outline-none focus:ring-4 focus:ring-yellow-300/50 font-medium text-gray-700 resize-none"></textarea>
                    <button onclick="postNote()" class="w-full bg-gradient-to-r from-yellow-400 to-orange-400 hover:from-yellow-300 hover:to-orange-300 text-white font-bold py-3 rounded-xl transition-all shadow-lg transform hover:-translate-y-1">
                        Kirim Pesan <i class="fa-solid fa-paper-plane ml-2"></i>
                    </button>
                </div>

                <!-- Messages -->
                <div id="notes-list" class="md:w-2/3 h-56 md:h-64 overflow-y-auto notes-container space-y-4 pr-3 py-2">
                    <!-- Notes injected by JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, deleteField, collection, addDoc, serverTimestamp, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'al-waqiah-vibrant';
        let app, db, auth;
        let authReady = false;

        const state = {
            lena: {},
            raihan: {},
            notes: []
        };

        const START_DATE = new Date(2026, 9, 21); // 21 Oktober 2026
        const TOTAL_DAYS = 30;

        try {
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (error) {
            console.error("Firebase init failed:", error);
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        function isDayMissed(dayIndex) {
            const today = new Date();
            today.setHours(0,0,0,0); 
            
            const expectedDate = new Date(START_DATE);
            expectedDate.setDate(expectedDate.getDate() + (dayIndex - 1));
            expectedDate.setHours(0,0,0,0);

            return today > expectedDate; 
        }

        function shootConfetti(isLena) {
            const colors = isLena ? ['#e879f9', '#fdf4ff', '#facc15'] : ['#22d3ee', '#ecfeff', '#facc15'];
            
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: colors,
                shapes: ['star', 'circle'],
                disableForReducedMotion: true
            });
        }

        function renderBoards() {
            ['lena', 'raihan'].forEach(user => {
                const container = document.getElementById(`grid-${user}`);
                const userData = state[user] || {};
                const isLena = user === 'lena';
                
                let completedCount = 0;
                let missedCount = 0;
                
                container.innerHTML = '';

                for (let i = 1; i <= TOTAL_DAYS; i++) {
                    const dayData = userData[i];
                    const isCompleted = !!dayData;
                    const isMissed = !isCompleted && isDayMissed(i);
                    
                    if (isCompleted) completedCount++;
                    if (isMissed) missedCount++;

                    const box = document.createElement('div');
                    
                    let baseClasses = "day-card relative flex flex-col items-center justify-center rounded-2xl p-2 cursor-pointer h-16 md:h-20 shadow-md select-none border-2 backdrop-blur-sm ";
                    
                    if (isCompleted) {
                        baseClasses += isLena 
                            ? "bg-gradient-to-br from-pink-100 to-fuchsia-100 border-fuchsia-300 text-fuchsia-800" 
                            : "bg-gradient-to-br from-cyan-100 to-blue-100 border-cyan-300 text-cyan-800";
                    } else if (isMissed) {
                        baseClasses += "bg-white/40 border-gray-200 text-gray-500";
                    } else {
                        baseClasses += "bg-white/70 border-white/80 text-gray-700 hover:bg-white/90";
                    }

                    box.className = baseClasses;
                    box.onclick = () => toggleDay(user, i, isCompleted);

                    if (isCompleted) {
                        // Ganti Ikon Hati menjadi Bintang Bersinar
                        box.innerHTML = `
                            <i class="fa-solid fa-star text-2xl md:text-3xl mb-1 glowing-star"></i>
                            <span class="text-[10px] md:text-xs font-black bg-white/80 px-2 py-0.5 rounded-full absolute bottom-1 shadow-sm">${formatTime(dayData.timestamp)}</span>
                            <span class="absolute top-1 right-1.5 text-[9px] font-bold opacity-60">${i}</span>
                        `;
                    } else {
                        box.innerHTML = `
                            <span class="text-sm md:text-base font-bold">H-${i}</span>
                            ${isMissed ? '<i class="fa-solid fa-xmark text-xs mt-1 text-red-500 drop-shadow-sm"></i>' : '<div class="w-2 h-2 rounded-full bg-gray-400/50 mt-2"></div>'}
                        `;
                    }
                    
                    container.appendChild(box);
                }

                document.getElementById(`stat-comp-${user}`).innerText = completedCount;
                document.getElementById(`stat-miss-${user}`).innerText = missedCount;
                document.getElementById(`stat-rem-${user}`).innerText = TOTAL_DAYS - completedCount;
                
                const percentage = Math.min((completedCount / TOTAL_DAYS) * 50, 50); 
                document.getElementById(`percent-${user}`).innerText = `${Math.round((completedCount/TOTAL_DAYS)*100)}%`;
                
                const offset = `calc(${percentage}% + 1rem)`;
                document.getElementById(`progress-${user}`).style[isLena ? 'left' : 'right'] = percentage === 50 ? '50%' : percentage + '%';
                
                if (percentage === 50) {
                     document.getElementById(`progress-${user}`).style.transform = `translateY(-50%) ${isLena ? 'translateX(-110%)' : 'translateX(110%)'}`;
                } else {
                     document.getElementById(`progress-${user}`).style.transform = `translateY(-50%) ${isLena ? 'translateX(-50%)' : 'translateX(50%)'}`;
                }
            });
        }

        function renderNotes() {
            const container = document.getElementById('notes-list');
            if (state.notes.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 font-semibold text-sm mt-12 bg-white/50 p-4 rounded-xl inline-block mx-auto">Belum ada pesan.</div>';
                container.classList.add('flex', 'justify-center');
                return;
            } else {
                container.classList.remove('flex', 'justify-center');
            }

            container.innerHTML = '';
            const sortedNotes = [...state.notes].sort((a, b) => {
                const timeA = a.serverTime ? new Date(a.serverTime).getTime() : 0;
                const timeB = b.serverTime ? new Date(b.serverTime).getTime() : 0;
                return timeB - timeA; 
            });

            sortedNotes.forEach(note => {
                const isLena = note.sender === 'Lena';
                const el = document.createElement('div');
                
                const alignment = isLena ? 'mr-8' : 'ml-8';
                const bgColors = isLena ? 'bg-gradient-to-r from-fuchsia-100 to-pink-50 border-fuchsia-200' : 'bg-gradient-to-r from-cyan-50 to-blue-100 border-cyan-200';
                const textColors = isLena ? 'text-fuchsia-800' : 'text-cyan-800';

                el.className = `p-4 rounded-2xl shadow-sm border-2 ${bgColors} ${alignment} relative transform transition-transform hover:scale-[1.02]`;
                
                el.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-extrabold ${textColors} flex items-center gap-2">
                            <div class="w-6 h-6 rounded-full bg-white flex items-center justify-center shadow-sm text-xs">${note.sender.charAt(0)}</div>
                            ${note.sender}
                        </span>
                        <span class="text-xs font-bold text-gray-500 bg-white/60 px-2 py-1 rounded-lg">${note.timeString}</span>
                    </div>
                    <p class="text-gray-800 font-medium leading-relaxed">${note.text}</p>
                `;
                container.appendChild(el);
            });
        }

        async function toggleDay(user, dayIndex, isCurrentlyCompleted) {
            if (!authReady || !db) {
                if (isCurrentlyCompleted) {
                    delete state[user][dayIndex];
                } else {
                    state[user][dayIndex] = { timestamp: new Date().toISOString() };
                    shootConfetti(user === 'lena');
                }
                renderBoards();
                return;
            }

            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'mission_progress', user);
            try {
                if (isCurrentlyCompleted) {
                    await updateDoc(docRef, { [`days.${dayIndex}`]: deleteField() });
                } else {
                    await setDoc(docRef, {
                        days: { [dayIndex]: { timestamp: new Date().toISOString() } }
                    }, { merge: true });
                    shootConfetti(user === 'lena');
                }
            } catch (error) {
                console.error("Error updating day:", error);
            }
        }

        async function postNote() {
            const sender = document.getElementById('note-sender').value;
            const text = document.getElementById('note-text').value.trim();
            
            if (!text) return;
            
            document.getElementById('note-text').value = ''; 

            if (!authReady || !db) {
                state.notes.push({
                    sender, text, 
                    timeString: formatTime(new Date().toISOString()),
                    serverTime: new Date().toISOString()
                });
                renderNotes();
                return;
            }

            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'notes_vibrant');
            try {
                await addDoc(colRef, {
                    sender,
                    text,
                    isoTime: new Date().toISOString(),
                    serverTimestamp: serverTimestamp() 
                });
            } catch (error) {
                console.error("Error adding note:", error);
            }
        }

        async function init() {
            renderBoards();
            renderNotes();

            if (!auth) return;

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                authReady = true;

                ['lena', 'raihan'].forEach(user => {
                    const ref = doc(db, 'artifacts', appId, 'public', 'data', 'mission_progress', user);
                    onSnapshot(ref, (snap) => {
                        state[user] = snap.exists() ? (snap.data().days || {}) : {};
                        renderBoards();
                    }, err => console.error(err));
                });

                const notesRef = collection(db, 'artifacts', appId, 'public', 'data', 'notes_vibrant');
                onSnapshot(query(notesRef), (snapshot) => {
                    state.notes = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        state.notes.push({
                            id: doc.id,
                            sender: data.sender,
                            text: data.text,
                            timeString: formatTime(data.isoTime),
                            serverTime: data.serverTimestamp ? data.serverTimestamp.toDate().toISOString() : data.isoTime
                        });
                    });
                    renderNotes();
                }, err => console.error(err));

            } catch (error) {
                console.error("Auth failed:", error);
            }
        }

        window.toggleDay = toggleDay;
        window.postNote = postNote;

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-WAQIAH 30 DAYS MISSION</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome untuk Icon Bintang -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="container">
        <header>
            <i class="fas fa-star header-icon"></i>
            <h1>AL - WAQIAH 30 DAYS MISSION</h1>
            <i class="fas fa-star header-icon"></i>
        </header>

        <main class="mission-board">
            <!-- LENA SECTION -->
            <div class="person-card">
                <div class="person-header header-lena">
                    <h2>LENA</h2>
                </div>
                <div class="grid-container" id="grid-lena">
                    <!-- Grid akan diisi oleh JavaScript -->
                </div>
                <div class="stats">
                    <p>Completed: <span id="completed-lena">0</span></p>
                    <p>Missed: <span id="missed-lena">0</span></p>
                    <p>Remaining: <span id="remaining-lena">30</span></p>
                </div>
            </div>

            <!-- RAIHAN SECTION -->
            <div class="person-card">
                <div class="person-header header-raihan">
                    <h2>RAIHAN</h2>
                </div>
                <div class="grid-container" id="grid-raihan">
                    <!-- Grid akan diisi oleh JavaScript -->
                </div>
                <div class="stats">
                    <p>Completed: <span id="completed-raihan">0</span></p>
                    <p>Missed: <span id="missed-raihan">0</span></p>
                    <p>Remaining: <span id="remaining-raihan">30</span></p>
                </div>
            </div>
        </main>
    </div>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
